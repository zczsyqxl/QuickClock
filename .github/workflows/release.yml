name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release
        working-directory: rust

      - name: Package (with top-level folder)
        shell: pwsh
        run: |
          $folder = "QuickClock-${{ github.ref_name }}"
          New-Item -ItemType Directory $folder | Out-Null
          Copy-Item rust/target/release/QuickClock.exe $folder
          Copy-Item LICENSE $folder
          Copy-Item packaging/README.txt $folder
          Compress-Archive -Path $folder -DestinationPath "$folder-windows-x64.zip"

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: QuickClock-*-windows-x64.zip
          body: |
            Fullscreen quick-launch clock — single exe, instant startup, zero dependencies.

            **Install**: download `QuickClock-*-windows-x64.zip` below, extract anywhere,
            run `QuickClock.exe`. Recommended: create a desktop shortcut and set a
            shortcut key (e.g. `Ctrl+Alt+T`). `ESC` or `Q` closes the clock.

            ---

            全屏快速时钟——单文件、秒启动、零依赖。下载下方 zip 解压即用；建议给桌面快捷方式
            设置快捷键(如 `Ctrl+Alt+T`),`ESC` 或 `Q` 关闭。
          generate_release_notes: true
