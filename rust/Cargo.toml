[package]
name = "quickclock"
version = "1.0.0"
edition = "2021"

[dependencies]
ab_glyph = "0.2"
chrono = "0.4"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "quickclock"
path = "src/lib.rs"
